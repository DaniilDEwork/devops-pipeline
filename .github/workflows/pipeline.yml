name: DevOps Pipeline

on:
  pull_request:
    types: [closed]
    branches:
      - dev

permissions:
  contents: write
  packages: write

env:
  PROJECT_NAME: devops-pipeline
  IMAGE_NAME: devops-pipeline

jobs:
  pipeline:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare variables
        run: |
          APP_VERSION="1.0.${{ github.run_number }}"
          RELEASE_TAG="v${APP_VERSION}"
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_LC=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')

          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "OWNER_LC=$OWNER_LC" >> $GITHUB_ENV
          echo "IMAGE_LC=$IMAGE_LC" >> $GITHUB_ENV
          echo "MERGED_BRANCH=${{ github.event.pull_request.head.ref }}" >> $GITHUB_ENV
          echo "BASE_BRANCH=${{ github.event.pull_request.base.ref }}" >> $GITHUB_ENV
          echo "MERGED_AT=${{ github.event.pull_request.merged_at }}" >> $GITHUB_ENV
          echo "MERGE_URL=${{ github.event.pull_request.html_url }}" >> $GITHUB_ENV
          echo "REPO_URL=${{ github.server_url }}/${{ github.repository }}" >> $GITHUB_ENV
          echo "DOCKER_FULL_NAME=ghcr.io/$OWNER_LC/$IMAGE_LC:$RELEASE_TAG" >> $GITHUB_ENV

      - name: Restore project
        run: dotnet restore ./DevOpsPipeline/DevOpsPipeline.csproj

      - name: Quality check
        run: dotnet format ./DevOpsPipeline/DevOpsPipeline.csproj --verify-no-changes --verbosity diagnostic

      - name: Build project
        run: dotnet build ./DevOpsPipeline/DevOpsPipeline.csproj --configuration Release --no-restore > build-output.txt

      - name: Create report file
        run: |
          {
            echo "Project: $PROJECT_NAME"
            echo "Version: $APP_VERSION"
            echo "Git tag: $RELEASE_TAG"
            echo "Merged branch: $MERGED_BRANCH"
            echo "Base branch: $BASE_BRANCH"
            echo "Merged at: $MERGED_AT"
            echo "Pull Request: $MERGE_URL"
            echo "Repository: $REPO_URL"
            echo
            echo "Build output:"
            cat build-output.txt
          } > release-report.txt

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: release-report.txt

      - name: Create git tag
        run: |
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub release and attach report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release-report.txt \
            --title "$RELEASE_TAG" \
            --notes "Automatic release after merge of $MERGED_BRANCH into $BASE_BRANCH."

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_LC }}:${{ env.RELEASE_TAG }}

      - name: Send Telegram message
        run: |
          MESSAGE=$(cat <<EOF
          <b>GITHUB DEVOPS BOT</b>
          Новый выпуск изменений

          <b>Проект:</b> $PROJECT_NAME
          <b>Версия:</b> $APP_VERSION
          <b>Дата merge:</b> $MERGED_AT

          Информация о Git-репозитории
          <b>Какая ветка была замержена:</b> $MERGED_BRANCH
          <b>Какой сейчас выпуск:</b> $APP_VERSION
          <b>GIT TAG:</b> $RELEASE_TAG
          <b>Ссылка на merge:</b> $MERGE_URL
          <b>Ссылка на репозиторий:</b> $REPO_URL

          Информация о Docker-репозитории
          <b>Владелец:</b> $OWNER_LC
          <b>Название:</b> $IMAGE_LC
          <b>Полное имя:</b> $DOCKER_FULL_NAME
          EOF
          )

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            --data-urlencode text="$MESSAGE"