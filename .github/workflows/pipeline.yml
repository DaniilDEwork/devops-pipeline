name: DevOps Pipeline

on:
  pull_request:
    types: [closed]
    branches:
      - dev

permissions:
  contents: write
  packages: write

env:
  PROJECT_NAME: devops-pipeline
  IMAGE_NAME: devops-pipeline

jobs:
  pipeline:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare variables
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "MERGED_BRANCH=${{ github.event.pull_request.head.ref }}" >> $GITHUB_ENV
          echo "BASE_BRANCH=${{ github.event.pull_request.base.ref }}" >> $GITHUB_ENV
          echo "MERGED_AT=${{ github.event.pull_request.merged_at }}" >> $GITHUB_ENV
          echo "MERGE_URL=${{ github.event.pull_request.html_url }}" >> $GITHUB_ENV
          echo "REPO_URL=${{ github.server_url }}/${{ github.repository }}" >> $GITHUB_ENV
          echo "DOCKER_OWNER=${{ github.repository_owner }}" >> $GITHUB_ENV
          echo "DOCKER_NAME=${{ env.IMAGE_NAME }}" >> $GITHUB_ENV
          echo "DOCKER_FULL_NAME=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:$VERSION" >> $GITHUB_ENV

      - name: Restore project
        run: dotnet restore ./DevOpsPipeline/DevOpsPipeline.csproj

      - name: Quality check and build
        run: |
          dotnet build ./DevOpsPipeline/DevOpsPipeline.csproj --configuration Release --no-restore > build-output.txt
          {
            echo "Project: $PROJECT_NAME"
            echo "Release: $VERSION"
            echo "Git tag: $VERSION"
            echo "Merged branch: $MERGED_BRANCH"
            echo "Base branch: $BASE_BRANCH"
            echo "Merged at: $MERGED_AT"
            echo "Pull Request: $MERGE_URL"
            echo "Repository: $REPO_URL"
            echo
            echo "Build output:"
            cat build-output.txt
          } > release-report.txt

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: release-report.txt

      - name: Create GitHub release and attach report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" release-report.txt \
            --title "$VERSION" \
            --notes "Automatic release after merge of $MERGED_BRANCH into $BASE_BRANCH."

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      - name: Send Telegram message
        run: |
          MESSAGE=$(cat <<EOF
          <b>GITHUB DEVOPS BOT</b>
          Новый выпуск изменений

          <b>Проект:</b> $PROJECT_NAME
          <b>Версия:</b> $VERSION
          <b>Дата merge:</b> $MERGED_AT

          <b>Информация о Git-репозитории</b>
          <b>Какая ветка была замержена:</b> $MERGED_BRANCH
          <b>Какой сейчас выпуск:</b> $VERSION
          <b>GIT TAG:</b> $VERSION
          <b>Ссылка на merge:</b> $MERGE_URL
          <b>Ссылка на репозиторий:</b> $REPO_URL

          <b>Информация о Docker-репозитории</b>
          <b>Владелец:</b> $DOCKER_OWNER
          <b>Название:</b> $DOCKER_NAME
          <b>Полное имя:</b> $DOCKER_FULL_NAME
          EOF
          )

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            --data-urlencode text="$MESSAGE"