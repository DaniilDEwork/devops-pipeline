name: DevOps Pipeline

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore project
        run: dotnet restore ./DevOpsPipeline/DevOpsPipeline.csproj

      - name: Build project
        run: dotnet build ./DevOpsPipeline/DevOpsPipeline.csproj --configuration Release --no-restore > build-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-report.txt

      - name: Send Telegram message
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text="Pipeline completed successfully. Repository: ${{ github.repository }}. Branch: ${{ github.ref_name }}. Commit: ${{ github.sha }}"